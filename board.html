<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>국회 요구자료 게시판</title><style>
:root{font-family:system-ui,'Malgun Gothic',sans-serif;color:#17243b;background:#f4f6fa}*{box-sizing:border-box}body{margin:0}header{background:#162746;color:white;padding:24px max(24px,calc((100vw - 1100px)/2))}header h1{margin:0;font-size:24px}header p{margin:7px 0 0;color:#becce0}main{max-width:1100px;margin:28px auto;padding:0 20px;display:grid;grid-template-columns:350px 1fr;gap:20px}.card{background:white;border:1px solid #dce3ed;border-radius:12px;padding:22px;box-shadow:0 3px 12px #1e33500a}h2{font-size:18px;margin:0 0 18px}h3{font-size:16px;margin:24px 0 10px}label{display:block;font-size:13px;font-weight:700;margin:13px 0 5px}input,textarea,select{width:100%;padding:10px 11px;border:1px solid #cbd5e1;border-radius:7px;font:inherit;background:white}textarea{min-height:85px;resize:vertical}button,.button{border:0;border-radius:7px;background:#2457ae;color:white;padding:10px 15px;font:inherit;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block}button:hover,.button:hover{background:#173e83}.secondary{background:#e9eef7;color:#17345f}.secondary:hover{background:#d9e3f2}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.muted{color:#65738a;font-size:13px}.item{border:1px solid #e0e6ef;border-radius:9px;padding:13px;margin:9px 0;cursor:pointer}.item:hover,.item.active{border-color:#2457ae;background:#f3f7ff}.item strong{display:block;margin-bottom:5px}.badge{display:inline-block;background:#eaf0ff;color:#244c93;border-radius:99px;padding:3px 9px;font-size:12px}.question{border-top:1px solid #e2e8f0;padding:18px 0}.question p{white-space:pre-wrap;margin:8px 0}.reply{background:#f3f6fa;border-radius:7px;padding:10px;margin:8px 0;font-size:13px}.reply a{color:#2457ae}.hidden{display:none}.notice{padding:12px;background:#eef7ee;color:#1b5c32;border-radius:7px;margin-bottom:15px}.error{background:#fff0ed;color:#a63423}#detail{min-height:350px}@media(max-width:800px){main{display:block}.card{margin-bottom:18px}}
</style></head><body><header><h1>국회 요구자료 게시판</h1><p>요구서 등록 · 문항별 배분 · 부서 회신 취합</p></header><main><aside><section class="card"><h2>새 요구서 등록</h2><form id="requestForm"><label>제목 *</label><input name="title" required placeholder="예: 2026 국정감사 자료요구"><div class="row"><div><label>위원회</label><input name="committee"></div><div><label>요구 의원</label><input name="member"></div></div><label>제출기한</label><input name="due_date" type="date"><label>원문 PDF</label><input name="file" type="file" accept=".pdf"><label>메모</label><textarea name="notes" placeholder="접수 경위, 제출 형식 등"></textarea><p><button>요구서 등록</button></p></form></section><section class="card" style="margin-top:20px"><h2>요구서 목록</h2><div id="list" class="muted">불러오는 중…</div></section></aside><section class="card" id="detail"><h2>요구서를 선택하세요</h2><p class="muted">왼쪽에서 요구서를 등록하거나 선택하면 문항과 회신을 관리할 수 있습니다.</p></section></main><script>
let selected=null;const $=s=>document.querySelector(s);const escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,options){const r=await fetch(path,options);const v=await r.json();if(!r.ok)throw Error(v.error||'요청 실패');return v}
async function fileData(file){if(!file)return null;return {name:file.name,data:await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result.split(',')[1]);reader.onerror=reject;reader.readAsDataURL(file)})}}
function message(text,error=false){let el=document.createElement('div');el.className='notice'+(error?' error':'');el.textContent=text;$('#detail').prepend(el);setTimeout(()=>el.remove(),4500)}
async function loadList(){const rows=await api('/api/requests');$('#list').innerHTML=rows.length?rows.map(r=>`<div class="item ${selected===r.id?'active':''}" data-id="${r.id}"><strong>${escape(r.title)}</strong><span class="muted">${escape(r.committee)} · ${escape(r.member)} · 기한 ${escape(r.due_date||'미정')}</span><br><span class="badge">${r.answered_count}/${r.question_count} 문항 회신</span></div>`).join(''):'등록된 요구서가 없습니다.';document.querySelectorAll('.item').forEach(el=>el.onclick=()=>openRequest(Number(el.dataset.id)))}
async function openRequest(id){selected=id;const {request:r,questions:qs}=await api('/api/requests/'+id);await loadList();$('#detail').innerHTML=`<h2>${escape(r.title)}</h2><p class="muted">${escape(r.committee)} · ${escape(r.member)} · 제출기한 ${escape(r.due_date||'미정')}</p><p><a class="button secondary" href="/api/requests/${id}/summary.csv">회신 현황 CSV</a> <a class="button" href="/api/requests/${id}/combined.csv">회신 내용 취합 CSV</a></p>${r.stored_name?`<p><a href="/api/files/${r.stored_name}">원문 PDF 내려받기</a></p>`:''}<p>${escape(r.notes)}</p><h3>문항 등록</h3><form id="questionForm"><div class="row"><input name="number" required placeholder="문항번호"><input name="department" placeholder="추천/확정 소관 과"></div><label>요구내용 *</label><textarea name="body" required></textarea><p><button>문항 추가</button></p></form><h3>문항 및 회신 (${qs.length})</h3><div id="questions">${qs.length?qs.map(q=>`<div class="question"><div class="row"><strong>${escape(q.number)}. ${escape(q.department||'소관 미지정')}</strong><span class="badge">${q.replies.length?'회신 '+q.replies.length+'건':'미회신'}</span></div><p>${escape(q.body)}</p>${q.replies.map(p=>`<div class="reply"><strong>${escape(p.department)}</strong> · ${escape(p.created_at)}<br>${escape(p.comment)}<br><a href="/api/files/${p.stored_name}">${escape(p.original_name)} 내려받기</a></div>`).join('')}<form class="replyForm" data-id="${q.id}"><div class="row"><input name="department" required placeholder="회신 부서"><input name="file" type="file" accept=".xlsx,.csv" required></div><label>회신 메모</label><input name="comment" placeholder="검증 사항, 보완 내용 등"><p><button class="secondary">회신 등록</button></p></form></div>`).join(''):'등록된 문항이 없습니다.'}</div>`;$('#questionForm').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target);try{await api(`/api/requests/${id}/questions`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(f))});await openRequest(id);message('문항을 등록했습니다.')}catch(err){message(err.message,true)}};document.querySelectorAll('.replyForm').forEach(form=>form.onsubmit=async e=>{e.preventDefault();let f=new FormData(form);try{let file=await fileData(f.get('file'));await api(`/api/questions/${form.dataset.id}/replies`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({department:f.get('department'),comment:f.get('comment'),file})});await openRequest(id);message('회신을 등록했습니다.')}catch(err){message(err.message,true)}})}
$('#requestForm').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target);try{let file=await fileData(f.get('file'));let v=await api('/api/requests',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...Object.fromEntries(f),file})});e.target.reset();await openRequest(v.id);message('요구서를 등록했습니다.')}catch(err){message(err.message,true)}};loadList().catch(e=>message(e.message,true));
</script></body></html>
